services:
    nginx:
        build:
            context: docker/nginx
        ports:
            - 80:80

    php-fpm:
        build:
            context: docker/php-fpm
        environment:
            DB_HOST: db
            DB_DATABASE: app
            DB_USERNAME: app
            DB_PASSWORD: secret
        volumes:
            - ./:/app

    php-cli:
        build:
            context: docker/php-cli
        environment:
            DB_HOST: db
            DB_DATABASE: app
            DB_USERNAME: app
            DB_PASSWORD: secret
        volumes:
            - ./:/app

    db:
        image: mariadb:11.7
        environment:
            MARIADB_DATABASE: app
            MARIADB_USER: app
            MARIADB_PASSWORD: secret
        volumes:
            - db-data:/var/lib/mysql
        ports:
            - 3306:3306

volumes:
    db-data:
